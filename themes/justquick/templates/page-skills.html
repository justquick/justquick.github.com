{% extends "base.html" %}

{% block title %}Skills - Justin Quick{% endblock %}

{% block page_content %}
<div class="margin-bottom">
  <h2 class="text-grey padding-16"><i class="fa fa-check-square-o fa-fw margin-right xxlarge text-orange"></i>Skills</h2>
  <h3>{{ page.content }}</h3>
  {% for skill in SITEDATA.info.skill_list %}
  <div class="container">
    <h3 class="opacity"><b>{{ skill.name }}</b> <span class="text-orange" style="font-size: 0.8em">{{ skill.years }} yrs</span></h3>
    <div class="light-grey round-xlarge">
      <div class="container center round-xlarge orange" style="width:{{ skill.percent }}%">{{ skill.percent }}%</div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
