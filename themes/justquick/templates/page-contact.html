{% extends "base.html" %}

{% block title %}Contact - Justin Quick{% endblock %}

{% block page_content %}
<div class="margin-bottom">
  <h2 class="text-grey padding-16"><i class="fa fa-envelope fa-fw margin-right xxlarge text-orange"></i>Contact Me</h2>
  <form method="POST" action="https://formspree.io/justquick@gmail.com">
    <h3>Your Email Address<br><input type="email" name="email" placeholder="email"></h3>
    <hr>
    <h3>Your Message<br><textarea rows="4" cols="50" name="message" placeholder="message"></textarea></h3>
    <button type="submit">Send Message</button>
  </form>
</div>
{% endblock %}
